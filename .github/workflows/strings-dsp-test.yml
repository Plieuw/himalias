name: Strings DSP host test

on:
  workflow_dispatch:
  push:
    branches:
      - himalia-strings-beta
      - himalia-strings-v1.26.0-beta
      - himalia-strings-v1.27.0-beta
      - himalia-strings-v1.28.0-beta
      - himalia-strings-v1.29.0-beta
      - himalia-strings-v1.30.0-beta
  pull_request:
    branches:
      - himalia-strings-beta

jobs:
  dsp-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile DSP test
        run: g++ -std=c++11 -O2 -Wall -Wextra -Werror tests/strings_engine_smoke.cpp -o strings_engine_smoke
      - name: Run DSP test
        run: ./strings_engine_smoke
      - name: Compile relative loudness report
        run: g++ -std=c++11 -O2 -Wall -Wextra -Werror tests/strings_level_report.cpp -o strings_level_report
      - name: Report relative loudness for all models
        run: ./strings_level_report
