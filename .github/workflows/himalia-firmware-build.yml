name: Himalia firmware build

on:
  push:
    branches:
      - himalia-strings-beta
      - 'himalia-strings-v*-beta'
  pull_request:
    branches:
      - himalia-strings-beta
  workflow_dispatch:

permissions:
  contents: write

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the repository toolchain image
        run: docker build -t himalia-iocore IOCore
      - name: Compile firmware and convert to UF2
        run: |
          mkdir -p "${{ github.workspace }}/firmware-output"
          docker run --rm \
            -v "${{ github.workspace }}:/PRJ" \
            -v "${{ github.workspace }}/firmware-output:/build" \
            -v "${{ github.workspace }}/IOCore/variant_IOCore:/root/.arduino15/packages/dadamachines_doppler/hardware/samd/1.2.9/variants/IOCore" \
            himalia-iocore bash -lc "arduino-cli compile --output-dir /build --fqbn dadamachines_doppler:samd:Himalia /PRJ/IOCore/HimaliaSketch/ && python3 /root/uf2/utils/uf2conv.py -b 0x4000 -c -o /build/HimaliaSketch.ino.uf2 /build/HimaliaSketch.ino.bin"
          test -s "${{ github.workspace }}/firmware-output/HimaliaSketch.ino.bin"
          test -s "${{ github.workspace }}/firmware-output/HimaliaSketch.ino.uf2"
      - name: Upload firmware files
        uses: actions/upload-artifact@v4
        with:
          name: himalia-strings-beta-firmware
          path: firmware-output/*
          if-no-files-found: error
          retention-days: 14
      - name: Commit the firmware
        if: github.event_name == 'push'
        run: |
          set -e
          VERSION=$(sed -n 's/.*HIMALIA_FW_VERSION "\([^"]*\)".*/\1/p' IOCore/HimaliaSketch/HimaliaSketch.ino | sed 's/-strings-beta//')
          DEST="firmware/Himalia_strings_v${VERSION}-beta.uf2"
          cp firmware-output/HimaliaSketch.ino.uf2 "$DEST"
          if [ -z "$(git status --porcelain -- "$DEST")" ]; then
            echo "firmware already up to date"
            exit 0
          fi
          git config user.name "himalia-ci"
          git config user.email "ci@users.noreply.github.com"
          git add "$DEST"
          git commit -m "Strings v${VERSION}-beta: compiled firmware [skip ci]"
          git push
      - name: Publish the beta release
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[release]')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          VERSION=$(sed -n 's/.*HIMALIA_FW_VERSION "\([^"]*\)".*/\1/p' IOCore/HimaliaSketch/HimaliaSketch.ino | sed 's/-strings-beta//')
          TAG="v${VERSION}-beta"
          ASSET="Himalia_strings_v${VERSION}-beta.uf2"
          cp firmware-output/HimaliaSketch.ino.uf2 "firmware-output/${ASSET}"
          TARGET=$(git rev-parse HEAD)
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --title "Himalia Strings ${TAG}" --target "$TARGET" --prerelease \
            --notes "Bowed strings firmware for the Himalia module, built by CI from ${TARGET}. See STRINGS_BETA.md on the himalia-strings-beta branch."
          gh release upload "$TAG" "firmware-output/${ASSET}" --clobber
          echo "published ${TAG} with ${ASSET}"
