name: Cello family level

# One-off: raises the four cello rows in STR_MODELS[] by 1.35 (2.6 dB) and then
# removes itself, so the commit it leaves behind contains only the engine change.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Raise the cello rows by 1.35
        run: |
          set -e
          python3 - <<'PY'
          p = 'IOCore/HimaliaSketch/strings_engine.h'
          src = open(p).read()
          expected = {'solo cello': 0.798, 'cello section': 0.780,
                      'romantic cello': 0.985, 'overpressure (ALF)': 0.854}
          out, hits = [], []
          for line in src.split('\n'):
              if line.lstrip().startswith('{') and '//' in line:
                  body, comment = line.split('//', 1)
                  name = comment.strip()
                  if name in expected:
                      i, j = body.index('{'), body.index('}')
                      f = body[i + 1:j].split(',')
                      old = float(f[11].strip().rstrip('f'))
                      assert abs(old - expected[name]) < 1e-6, (name, old)
                      new = round(old * 1.35, 3)
                      f[11] = ' %.3ff' % new
                      body = body[:i + 1] + ','.join(f) + body[j:]
                      hits.append((name, old, new))
                      line = body + '//' + comment
              out.append(line)
          assert len(hits) == 4, hits
          open(p, 'w').write('\n'.join(out))
          for name, old, new in hits:
              print('%-18s %.3f -> %.3f' % (name, old, new))
          PY
          git diff --stat
      - name: Commit, then take this workflow out
        run: |
          set -e
          git config user.name "himalia-ci"
          git config user.email "ci@users.noreply.github.com"
          git rm -q .github/workflows/cello-gain.yml
          git add IOCore/HimaliaSketch/strings_engine.h
          git commit -m "Cello family: +2.6 dB so it sits within ~2 dB of the violin"
          git push
