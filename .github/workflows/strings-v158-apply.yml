name: Strings v1.58.0 source apply

# One-off workflow for the v1.58.0-beta branch: applies patches/v1.58.0.patch
# (the source of this release), then removes the patch and this workflow so the
# branch carries the real source and a clean tree.
on:
  push:
    branches:
      - himalia-strings-v1.58.0-beta

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply the source patch
        run: |
          set -e
          if [ ! -f patches/v1.58.0.patch ]; then
            echo "nothing to apply"
            exit 0
          fi
          git apply -v patches/v1.58.0.patch
          git rm -q patches/v1.58.0.patch
          git rm -q .github/workflows/strings-v158-apply.yml
          git add -A
          git config user.name "himalia-ci"
          git config user.email "ci@users.noreply.github.com"
          git commit -m "Strings v1.58.0-beta: per-player instruments, fuller body, cheaper engine"
          git push
